# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
      - name: Update
        run: sudo apt-get update
      - name: Install system dependencies
        run: sudo apt-get install -y libudev-dev libpipewire-0.3-dev pkg-config
      - name: Install dependencies
        run: go get .
      - name: Build
        # libpipewire-0.3.pc advertises -fno-strict-overflow, which is not on
        # cgo's list of accepted compiler flags, so pkg-config output alone
        # fails the build once the runner image ships a recent enough pipewire.
        env:
          CGO_CFLAGS_ALLOW: -fno-strict-overflow
        run: go build -v ./...
