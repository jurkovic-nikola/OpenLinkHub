{{ define "xeneon-device-temp" }}
{{ $root := .Root }}
{{ $widgetArea := .WidgetArea }}
{{ $widget := $widgetArea.Widget }}
<div class="card system-card thermal-widget" id="xeneon-device-temp" style="{{ if $widget.TextColor }}--widget-text: {{ $widget.TextColor }};{{ end }}{{ if $widget.SubTextColor }}--widget-subtext: {{ $widget.SubTextColor }};{{ end }}{{ if $widget.DataColor }}--widget-accent: {{ $widget.DataColor }};{{ end }}{{ if gt $widget.FontSize 0 }}--widget-font-size: {{ $widget.FontSize }}px;{{ end }}{{ if gt $widget.SubFontSize 0 }}--widget-subfont-size: {{ $widget.SubFontSize }}px;{{ end }}" data-temperature-unit="{{ $widget.Unit }}" data-device-id="{{ $widget.DeviceId }}" data-channel-id="{{ $widget.ChannelId }}" data-max="{{ $widget.Max }}" data-color="{{ $widget.DataColor }}">
    <div class="card-body">
        <div class="thermal-meta">
            <div class="big-label">{{ $widget.HeaderText }}</div>
        </div>
        <div class="ring-chart">
            <svg viewBox="0 0 120 120" aria-hidden="true">
                <circle class="ring-track" cx="60" cy="60" r="46"></circle>
                <circle class="ring-progress" cx="60" cy="60" r="46"></circle>
            </svg>
            <div class="center">
                <div class="small">
                    <div class="thermal-temp chart-temp" style="color: {{ $widget.TextColor }}">--</div>
                </div>
                <div class="big">{{ $widget.Unit }}</div>
            </div>
        </div>
    </div>
</div>
{{ end }}
